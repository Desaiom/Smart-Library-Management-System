# =====================================================================
# PROD profile — MySQL, driven by environment variables.
# Never commit real secrets; inject via env in your deployment.
# =====================================================================
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smart_library?useSSL=false&serverTimezone=UTC}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect

library:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

logging:
  level:
    com.smartlibrary: INFO
    root: WARN

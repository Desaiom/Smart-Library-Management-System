# =====================================================================
# DEV profile — H2 in-memory DB by default for zero-setup local runs.
# Switch the datasource block to MySQL (commented below) when you have
# a local MySQL instance running.
# =====================================================================
spring:
  # ---- H2 (default, no install needed) ----
  datasource:
    url: jdbc:h2:mem:smartlibrary;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always

  # ---- MySQL (uncomment to use, and comment the H2 block above) ----
#   datasource:
#     url: jdbc:mysql://localhost:3306/smart_library?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#     driver-class-name: com.mysql.cj.jdbc.Driver
#     username: root
#     password: pass1234
#   jpa:
#     hibernate:
#       ddl-auto: update
#     show-sql: true
#     database-platform: org.hibernate.dialect.MySQLDialect

logging:
  level:
    com.smartlibrary: DEBUG
    org.hibernate.SQL: DEBUG
